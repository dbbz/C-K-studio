<svg xmlns="http://www.w3.org/2000/svg" width="880" height="322" viewBox="0 0 880 322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#f2f1ec"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#a8a79e"/></marker><marker id="a-ink3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#6e6d67"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#d4a544"/></marker><marker id="a-exp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#d95926"/></marker></defs><rect x="0.5" y="0.5" width="879" height="321" rx="12" fill="#141413" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/><text x="28" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#6e6d67" letter-spacing="0.1em">THE FOUR OPERATORS</text><rect x="40" y="150" width="290" height="134" rx="10" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/><rect x="550" y="150" width="290" height="134" rx="10" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/><text x="64" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f2f1ec">C — concept space</text><text x="64" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">propositions K can neither prove</text><text x="64" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">nor refute. Not vagueness —</text><text x="64" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">the object does not exist yet.</text><text x="574" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f2f1ec">K — knowledge space</text><text x="574" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">propositions with a definite status</text><text x="574" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">for this designer, now: true, false,</text><text x="574" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">or not yet looked up.</text><path d="M546,192 L338,192" fill="none" stroke="#a8a79e" stroke-width="1.25" stroke-linecap="round" marker-end="url(#a-ink2)"/><text x="440" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#f2f1ec" text-anchor="middle">K→C  disjunction</text><text x="440" y="179" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6e6d67" text-anchor="middle">new knowledge opens a concept</text><path d="M334,246 L542,246" fill="none" stroke="#a8a79e" stroke-width="1.25" stroke-linecap="round" marker-end="url(#a-ink2)"/><text x="440" y="267" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#f2f1ec" text-anchor="middle">C→K  conjunction</text><text x="440" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6e6d67" text-anchor="middle">the concept acquires a status</text><path d="M118,148 C130,92 240,92 252,144" fill="none" stroke="#d95926" stroke-width="1.25" stroke-opacity="0.9" stroke-linecap="round" marker-end="url(#a-exp)"/><text x="185" y="65" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#d95926" text-anchor="middle">C→C  partition</text><text x="185" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6e6d67" text-anchor="middle">add an attribute: restrictive or expansive</text><path d="M628,148 C640,92 750,92 762,144" fill="none" stroke="#a8a79e" stroke-width="1.25" stroke-linecap="round" marker-end="url(#a-ink2)"/><text x="695" y="65" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#f2f1ec" text-anchor="middle">K→K  learning</text><text x="695" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6e6d67" text-anchor="middle">research aimed at deciding a concept</text></svg>
