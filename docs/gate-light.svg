<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#191917"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#56554f"/></marker><marker id="a-ink3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#91908a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#b07d16"/></marker><marker id="a-exp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#eb6834"/></marker></defs><rect x="0.5" y="0.5" width="879" height="267" rx="12" fill="#fcfcfb" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><text x="28" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#91908a" letter-spacing="0.1em">THE UNDECIDABILITY GATE</text><rect x="28" y="58" width="236" height="130" rx="8" fill="#191917" fill-opacity="0.035" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><text x="48" y="84" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#91908a" letter-spacing="0.1em">CANDIDATE</text><text x="48" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#191917">There exists a vessel</text><text x="48" y="129" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#191917">that travels far faster</text><text x="48" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#191917">than the hull speed of</text><text x="48" y="167" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#191917">its waterline length.</text><path d="M270,123 L302,123" fill="none" stroke="#91908a" stroke-width="1.25" stroke-linecap="round" marker-end="url(#a-ink3)"/><line x1="310" y1="78" x2="310" y2="228" stroke="#191917" stroke-width="1.25" stroke-opacity="0.44800000000000006" stroke-linecap="round"/><text x="310" y="46" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#91908a" text-anchor="middle" letter-spacing="0.1em">ASK K</text><line x1="310" y1="78" x2="326" y2="78" stroke="#91908a" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/><text x="338" y="82.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#56554f">“Yes, those exist.”</text><rect x="628" y="65" width="56" height="26" rx="6" fill="#191917" fill-opacity="0.035" stroke="#91908a" stroke-width="1" stroke-opacity="0.56"/><text x="656" y="82" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#91908a" text-anchor="middle">K</text><text x="700" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#91908a">knowledge</text><line x1="310" y1="114" x2="326" y2="114" stroke="#91908a" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/><text x="338" y="118.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#56554f">“No, that’s impossible.”</text><rect x="628" y="101" width="56" height="26" rx="6" fill="#191917" fill-opacity="0.035" stroke="#91908a" stroke-width="1" stroke-opacity="0.56"/><text x="656" y="118" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#91908a" text-anchor="middle">K</text><text x="700" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#91908a">knowledge, status false</text><line x1="310" y1="150" x2="326" y2="150" stroke="#b07d16" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/><text x="338" y="154.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#56554f">“I’d have to look it up.”</text><rect x="628" y="137" width="56" height="26" rx="6" fill="#191917" fill-opacity="0.035" stroke="#b07d16" stroke-width="1" stroke-opacity="0.7"/><text x="656" y="154" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#b07d16" text-anchor="middle">K→K</text><text x="700" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#91908a">research, then re-test</text><line x1="310" y1="228" x2="326" y2="228" stroke="#191917" stroke-width="1" stroke-opacity="0.9" stroke-linecap="round"/><text x="338" y="232.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#191917">“I can’t say.”</text><rect x="628" y="215" width="56" height="26" rx="6" fill="#191917" fill-opacity="1" stroke-opacity="0.56"/><text x="656" y="232" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#fcfcfb" text-anchor="middle">C</text><text x="700" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#56554f">a concept</text><path d="M620,166 C556,180 420,180 324,170" fill="none" stroke="#b07d16" stroke-width="1.25" stroke-opacity="0.85" stroke-dasharray="3 3.5" stroke-linecap="round" marker-end="url(#a-warn)"/><text x="338" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#b07d16" font-style="italic">uncertain K is not a concept — it is an unanswered question</text><line x1="300" y1="212" x2="852" y2="212" stroke="#191917" stroke-width="1" stroke-opacity="0.14" stroke-linecap="round"/></svg>
