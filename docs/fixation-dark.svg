<svg xmlns="http://www.w3.org/2000/svg" width="880" height="326" viewBox="0 0 880 326" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#f2f1ec"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#a8a79e"/></marker><marker id="a-ink3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#6e6d67"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#d4a544"/></marker><marker id="a-exp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#d95926"/></marker></defs><rect x="0.5" y="0.5" width="879" height="325" rx="12" fill="#141413" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/><text x="28" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#6e6d67" letter-spacing="0.1em">THE HEN’S EGG PARADIGM · N=142, SIX POPULATIONS</text><text x="28" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a8a79e" font-style="italic">“Propose as many original solutions as possible: ensure that a hen’s egg dropped from 10 m does not break.”</text><text x="28" y="118" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#6e6d67" letter-spacing="0.1em">TEN SOLUTION CATEGORIES</text><rect x="28" y="128" width="14" height="14" rx="3" fill="#3987e5" fill-opacity="1"/><rect x="48" y="128" width="14" height="14" rx="3" fill="#3987e5" fill-opacity="1"/><rect x="68" y="128" width="14" height="14" rx="3" fill="#3987e5" fill-opacity="1"/><rect x="88" y="128" width="14" height="14" rx="3" fill="#d95926" fill-opacity="0.45"/><rect x="108" y="128" width="14" height="14" rx="3" fill="#d95926" fill-opacity="0.45"/><rect x="128" y="128" width="14" height="14" rx="3" fill="#d95926" fill-opacity="0.45"/><rect x="148" y="128" width="14" height="14" rx="3" fill="#d95926" fill-opacity="0.45"/><rect x="168" y="128" width="14" height="14" rx="3" fill="#d95926" fill-opacity="0.45"/><rect x="188" y="128" width="14" height="14" rx="3" fill="#d95926" fill-opacity="0.45"/><rect x="208" y="128" width="14" height="14" rx="3" fill="#d95926" fill-opacity="0.45"/><text x="240" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6e6d67">3 restrictive · 7 expansive</text><rect x="28" y="160" width="320" height="28" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/><rect x="28" y="165" width="2.5" height="18" rx="1.5" fill="#3987e5"/><text x="46" y="179" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#f2f1ec">damping the shock</text><rect x="28" y="194" width="320" height="28" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/><rect x="28" y="199" width="2.5" height="18" rx="1.5" fill="#3987e5"/><text x="46" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#f2f1ec">protecting the egg</text><rect x="28" y="228" width="320" height="28" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/><rect x="28" y="233" width="2.5" height="18" rx="1.5" fill="#3987e5"/><text x="46" y="247" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#f2f1ec">slowing the fall</text><text x="470" y="118" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#6e6d67" letter-spacing="0.1em">SHARE OF ALL ANSWERS IN THOSE THREE</text><text x="470" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">psychology undergrads</text><rect x="636" y="169" width="180" height="10" rx="5" fill="#f2f1ec" fill-opacity="0.09"/><rect x="636" y="169" width="145.8" height="10" rx="5" fill="#3987e5"/><text x="852" y="178" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#f2f1ec" text-anchor="end">81%</text><text x="470" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">engineers</text><rect x="636" y="203" width="180" height="10" rx="5" fill="#f2f1ec" fill-opacity="0.09"/><rect x="636" y="203" width="136.8" height="10" rx="5" fill="#3987e5"/><text x="852" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#f2f1ec" text-anchor="end">76%</text><text x="470" y="246" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">designers</text><rect x="636" y="237" width="180" height="10" rx="5" fill="#f2f1ec" fill-opacity="0.09"/><rect x="636" y="237" width="113.4" height="10" rx="5" fill="#3987e5"/><text x="852" y="246" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#f2f1ec" text-anchor="end">63%</text><text x="28" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">All three silently assume a device — and an inert one.</text><text x="28" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#6e6d67">Naming that unstated attribute is what generates the other seven.</text><text x="470" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a8a79e">Designers do best. Designers are still fixated.</text></svg>
