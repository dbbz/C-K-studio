<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#191917"/></marker><marker id="a-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#56554f"/></marker><marker id="a-ink3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#91908a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#b07d16"/></marker><marker id="a-exp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#eb6834"/></marker></defs><rect x="0.5" y="0.5" width="879" height="469" rx="12" fill="#fcfcfb" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><text x="28" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#91908a" letter-spacing="0.1em">THE HYDROFOIL SESSION, AROUND EVENT 7</text><rect x="28" y="48" width="640" height="46" rx="8" fill="#191917" fill-opacity="0.035" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><text x="46" y="72" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#91908a">C0</text><text x="80" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#191917" font-style="italic">There exists a vessel that travels far faster than its hull speed.</text><rect x="56" y="106" width="612" height="36" rx="8" fill="#191917" fill-opacity="0.021" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><rect x="56" y="112" width="2.5" height="24" rx="1.5" fill="#2a78d6" fill-opacity="0.4"/><text x="74" y="130" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#91908a">C1</text><text x="108" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="550" fill="#91908a">+ more power</text><rect x="634" y="118" width="20" height="16" rx="4" fill="#2a78d6" fill-opacity="0.35"/><text x="644" y="130" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#2a78d6" text-anchor="middle" fill-opacity="0.6">R</text><text x="614" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a" text-anchor="end">refuted by K1</text><rect x="56" y="150" width="612" height="36" rx="8" fill="#191917" fill-opacity="0.021" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><rect x="56" y="156" width="2.5" height="24" rx="1.5" fill="#2a78d6" fill-opacity="0.4"/><text x="74" y="174" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#91908a">C2</text><text x="108" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="550" fill="#91908a">+ a longer waterline</text><rect x="634" y="162" width="20" height="16" rx="4" fill="#2a78d6" fill-opacity="0.35"/><text x="644" y="174" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#2a78d6" text-anchor="middle" fill-opacity="0.6">R</text><text x="614" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a" text-anchor="end">abandoned</text><rect x="56" y="206" width="612" height="72" rx="8" fill="#b07d16" fill-opacity="0.07" stroke="#b07d16" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 4"/><text x="74" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#b07d16" letter-spacing="0.1em">EVENT 7 · K→K</text><text x="74" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#56554f">Wave-making resistance is a consequence of displacing water at the surface.</text><text x="74" y="267" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#56554f">It is not a property of “boats” as such.</text><path d="M100,278 L100,296" fill="none" stroke="#eb6834" stroke-width="1.25" stroke-linecap="round" marker-end="url(#a-exp)"/><text x="114" y="294" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#eb6834">K→C</text><rect x="56" y="300" width="612" height="62" rx="8" fill="#191917" fill-opacity="0.035" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><rect x="56" y="306" width="2.5" height="50" rx="1.5" fill="#eb6834" fill-opacity="1"/><text x="74" y="324" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#91908a">C3</text><text x="108" y="324" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="550" fill="#191917">+ does not displace water</text><rect x="634" y="312" width="20" height="16" rx="4" fill="#eb6834" fill-opacity="0.16"/><text x="644" y="324" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#eb6834" text-anchor="middle" fill-opacity="1">E</text><text x="108" y="345" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="600" fill="#eb6834" letter-spacing="0.08em">BREAKS</text><text x="164" y="345" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#56554f">the definition of a boat as a body supported by buoyancy</text><rect x="84" y="372" width="584" height="34" rx="8" fill="#191917" fill-opacity="0.035" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><rect x="84" y="378" width="2.5" height="22" rx="1.5" fill="#2a78d6" fill-opacity="1"/><text x="102" y="396" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#91908a">C4</text><text x="136" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="550" fill="#191917">+ supported by a submerged wing</text><rect x="634" y="384" width="20" height="16" rx="4" fill="#2a78d6" fill-opacity="0.16"/><text x="644" y="396" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#2a78d6" text-anchor="middle" fill-opacity="1">R</text><rect x="84" y="414" width="584" height="34" rx="8" fill="#191917" fill-opacity="0.035" stroke="#191917" stroke-width="1" stroke-opacity="0.14"/><rect x="84" y="420" width="2.5" height="22" rx="1.5" fill="#2a78d6" fill-opacity="1"/><text x="102" y="438" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#91908a">C5</text><text x="136" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="550" fill="#191917">+ supported by trapped air</text><rect x="634" y="426" width="20" height="16" rx="4" fill="#2a78d6" fill-opacity="0.16"/><text x="644" y="438" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#2a78d6" text-anchor="middle" fill-opacity="1">R</text><line x1="686" y1="114" x2="686" y2="178" stroke="#2a78d6" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/><text x="700" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">K can settle both,</text><text x="700" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">so neither is a concept.</text><text x="700" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">A century of</text><text x="700" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">naval architecture.</text><line x1="686" y1="314" x2="686" y2="362" stroke="#eb6834" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/><text x="700" y="326" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">Expansive, and it names</text><text x="700" y="342" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">what it breaks — that</text><text x="700" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">name is the gate.</text><line x1="686" y1="380" x2="686" y2="444" stroke="#2a78d6" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/><text x="700" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">Restrictive under an</text><text x="700" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">expansive parent. Type</text><text x="700" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">is judged against the</text><text x="700" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#91908a">parent, not the root.</text></svg>
